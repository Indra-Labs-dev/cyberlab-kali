name: nmap
category: reconnaissance
description: Network exploration and port/service scanning.
risk_level: CAUTION
ai_allowed: true
command:
  executable: nmap
# -oX - forces machine-readable XML on stdout so the parser never has to
# guess at nmap's human-readable text format. -sT avoids CAP_NET_RAW, which
# the cyberlab-kali container intentionally does not have (see docs/security.md).
# -Pn is required for the same reason: nmap's default host-discovery ping
# (ICMP/ARP) also needs a raw socket, even with -sT for the port scan itself;
# without -Pn, scanning any target other than the Kali container itself fails
# with "Couldn't open a raw socket or eth handle" (found via Phase 9 testing).
fixed_args: ["-oX", "-", "-sT", "-Pn"]
default_timeout: 60
max_timeout: 240
arguments:
  - name: target
    type: target
    required: true
    positional: true
    description: Hostname, IP address, or CIDR range to scan.
  - name: ports
    type: string
    flag: "-p"
    required: false
    pattern: '^[0-9,\-]{1,64}$'
    description: Port list/range, e.g. "80,443" or "1-1024".
  - name: service_detection
    type: boolean
    flag: "-sV"
    default: false
    description: Probe open ports for service/version info.
  - name: default_scripts
    type: boolean
    flag: "-sC"
    default: false
    description: Run nmap's default NSE script set.
  - name: timing
    type: choice
    flag: "-T"
    choices: ["1", "2", "3", "4"]
    required: false
    description: Timing template (1=slow/stealthy .. 4=fast). T5 excluded as too aggressive for shared/lab networks.
  - name: top_ports
    type: integer
    flag: "--top-ports"
    required: false
    min_value: 1
    max_value: 1000
    description: Scan nmap's N most common ports instead of a manual range.
  - name: vuln_scripts
    type: boolean
    flag: "--script=vuln"
    default: false
    description: Run the NSE "vuln" script category. Noisier and slower than default_scripts.
# No "OS Detection" profile: nmap's -O needs CAP_NET_RAW, which this
# container intentionally does not have (see docs/security.md, same reason
# -sT/-Pn are forced) -- offering a profile that would just fail isn't
# useful, so it's left out rather than faked.
output:
  format: xml
  parser: nmap
profiles:
  - name: quick_scan
    description: Fast top-ports scan, no service/version probing.
    args: {timing: "4", top_ports: 100}
    timeout: 60
  - name: service_detection
    description: Detect service/version info on open ports.
    args: {timing: "4", service_detection: true, top_ports: 100}
    timeout: 90
  - name: top_ports
    description: Scan the 1000 most common ports.
    args: {timing: "4", top_ports: 1000}
    timeout: 120
  - name: full_tcp
    description: Full 1-65535 TCP connect scan. Slow.
    args: {timing: "4", ports: "1-65535"}
    timeout: 240
    risk_level: RESTRICTED
  - name: vulnerability_nse
    description: Default + vuln NSE scripts on common ports. Noisy, use only against LAB/AUTHORIZED targets.
    args: {timing: "4", top_ports: 100, default_scripts: true, vuln_scripts: true}
    timeout: 180
    risk_level: RESTRICTED
