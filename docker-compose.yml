name: cyberlab

networks:
  cyberlab-backend:
    name: cyberlab-backend
    driver: bridge
  cyberlab-kali-net:
    name: cyberlab-kali-net
    driver: bridge

volumes:
  cyberlab-postgres-data:
  cyberlab-redis-data:

services:
  cyberlab-postgres:
    image: postgres:16-alpine
    container_name: cyberlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberlab}
      POSTGRES_USER: ${POSTGRES_USER:-cyberlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberlab}
    volumes:
      - cyberlab-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    networks:
      - cyberlab-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberlab} -d ${POSTGRES_DB:-cyberlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"

  cyberlab-redis:
    image: redis:7-alpine
    container_name: cyberlab-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - cyberlab-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-63790}:6379"
    networks:
      - cyberlab-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: "0.5"

  cyberlab-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberlab-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cyberlab-postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://cyberlab-redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3300}
      KALI_AGENT_URL: http://cyberlab-kali:9000
      KALI_AGENT_TOKEN: ${KALI_AGENT_TOKEN:?KALI_AGENT_TOKEN must be set in .env}
      LABMANAGER_URL: http://cyberlab-labmanager:9100
      LABMANAGER_TOKEN: ${LABMANAGER_TOKEN:?LABMANAGER_TOKEN must be set in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # BIND_ADDRESS defaults to 127.0.0.1 (local-only). Set it to 0.0.0.0 in
      # .env to reach CyberLab from other devices on your network -- do this
      # together with AUTH_ENABLED=true, see .env.example.
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8300}:8000"
    networks:
      - cyberlab-backend
      - cyberlab-kali-net
    depends_on:
      cyberlab-postgres:
        condition: service_healthy
      cyberlab-redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: "1.0"

  cyberlab-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberlab-worker
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.worker"]
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      POSTGRES_HOST: cyberlab-postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://cyberlab-redis:6379/0
      KALI_AGENT_URL: http://cyberlab-kali:9000
      KALI_AGENT_TOKEN: ${KALI_AGENT_TOKEN:?KALI_AGENT_TOKEN must be set in .env}
    networks:
      - cyberlab-backend
      - cyberlab-kali-net
    depends_on:
      cyberlab-redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: "1.0"

  cyberlab-kali:
    build:
      context: ./kali
      dockerfile: Dockerfile
    container_name: cyberlab-kali
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${KALI_AGENT_TOKEN:?KALI_AGENT_TOKEN must be set in .env}
    networks:
      - cyberlab-kali-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Phase 12: masscan (raw SYN send) and traceroute (raw ICMP/UDP probes)
    # need CAP_NET_RAW to function at all -- there's no unprivileged mode for
    # either, unlike nmap's -sT. This is a deliberate, narrow addition, not a
    # blanket revert of cap_drop: ALL: the container still runs non-root,
    # still has no docker.sock, still can't reach anything outside
    # cyberlab-kali-net + dynamically-attached lab networks. The capability
    # this grants is crafting raw packets on those networks only -- see
    # docs/security.md for the full trade-off writeup.
    cap_add:
      - NET_RAW
    mem_limit: 512m
    cpus: "1.0"

  # Sits between cyberlab-labmanager and the real docker.sock. Labmanager no
  # longer touches the socket directly — it talks to this proxy over plain
  # HTTP on the internal cyberlab-backend network, and the proxy exposes only
  # the narrow slice of the Docker API that lab lifecycle management actually
  # needs (container/network/image read+create, no exec/volumes/system/swarm).
  # This means even a full compromise of labmanager can no longer docker-exec
  # into arbitrary containers, read secrets, or touch the Docker daemon
  # configuration. See docs/security.md.
  cyberlab-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: cyberlab-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      # Everything else is explicitly denied.
      EXEC: 0
      VOLUMES: 0
      SYSTEM: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      TASKS: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cyberlab-backend
    # Not read_only: the entrypoint templates haproxy.cfg from a file baked
    # into the image at container start, so the root fs needs to stay
    # writable. The real hardening here is the API allowlist above (EXEC,
    # VOLUMES, SYSTEM, etc. all denied), not the container's own filesystem.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: "0.25"

  cyberlab-labmanager:
    build:
      context: ./labmanager
      dockerfile: Dockerfile
    container_name: cyberlab-labmanager
    restart: unless-stopped
    depends_on:
      - cyberlab-docker-proxy
    environment:
      LABMANAGER_TOKEN: ${LABMANAGER_TOKEN:?LABMANAGER_TOKEN must be set in .env}
      KALI_NETWORK_NAME: cyberlab-kali-net
      # docker.from_env() (Python docker SDK) honors DOCKER_HOST exactly like
      # the Docker CLI, so no code changes were needed to redirect from a
      # socket mount to this TCP proxy endpoint.
      DOCKER_HOST: tcp://cyberlab-docker-proxy:2375
    networks:
      - cyberlab-backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.5"

  cyberlab-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: cyberlab-frontend
    restart: unless-stopped
    environment:
      # HOST_IP defaults to "localhost". Set it to this machine's LAN IP in
      # .env for other devices to be able to resolve the API/WS -- the
      # browser evaluates these URLs itself, so "localhost" only ever works
      # for a browser running on this same machine. See .env.example.
      NUXT_PUBLIC_API_BASE: http://${HOST_IP:-localhost}:${API_PORT:-8300}
      NUXT_PUBLIC_WS_BASE: ws://${HOST_IP:-localhost}:${API_PORT:-8300}
      NUXT_API_PROXY_TARGET: http://cyberlab-api:8000/api
      # Only meaningful when the API is started with AUTH_ENABLED=true; empty
      # by default. Must match the API's API_SECRET_KEY. See docs/security.md.
      NUXT_PUBLIC_API_TOKEN: ${AUTH_ENABLED:+${API_SECRET_KEY}}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3300}:3000"
    networks:
      - cyberlab-backend
    depends_on:
      - cyberlab-api
    mem_limit: 768m
    cpus: "1.0"
